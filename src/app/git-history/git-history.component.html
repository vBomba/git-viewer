<ngx-graph
  [links]="links"
  [nodes]="nodes"
  layout="dagreCluster"
  [enableZoom]="true"
  [autoZoom]="true"
  [panOnZoom]="false"
  (select)="onNodeSelect($event)"
>
  <ng-template #defsTemplate>
    <svg:marker
      id="arrow"
      viewBox="0 -5 10 10"
      refX="8"
      refY="0"
      markerWidth="4"
      markerHeight="4"
      orient="auto"
    >
      <svg:path d="M0,-5L10,0L0,5" class="arrow-head" />
    </svg:marker>
  </ng-template>

  <ng-template #clusterTemplate let-cluster>
    <svg:g class="node cluster">
      <svg:rect
        rx="5"
        ry="5"
        [attr.width]="cluster.dimension.width"
        [attr.height]="cluster.dimension.height"
        [attr.fill]="cluster.data.color"
      />
    </svg:g>
  </ng-template>

  <ng-template #nodeTemplate let-node>
    <svg:g class="node">
      <!-- <svg:circle
        [attr.r]="node.dimension.height / 2"
       
      -->
      <svg:rect
        [attr.width]="node.dimension.width"
        [attr.height]="node.dimension.width"
        [attr.fill]="node.data.branchColor"
      />
      <svg:text alignment-baseline="central" [attr.x]="10">
        <!-- [attr.y]="node.dimension.height / 2" -->
        <svg:tspan x="10" dy="1.2em">{{ node.label.split("\n")[0] }}</svg:tspan>
        <svg:tspan x="10" dy="1.2em">{{ node.label.split("\n")[1] }}</svg:tspan>
        <svg:tspan x="10" dy="1.2em">{{ node.label.split("\n")[2] }}</svg:tspan>
      </svg:text>
    </svg:g>
  </ng-template>

  <ng-template #linkTemplate let-link>
    <svg:g class="edge">
      <svg:path
        class="line"
        stroke-width="2"
        marker-end="url(#arrow)"
      ></svg:path>
      <svg:text class="edge-label" text-anchor="middle">
        <textPath
          class="text-path"
          [attr.href]="'#' + link.id"
          [style.dominant-baseline]="link.dominantBaseline"
          startOffset="50%"
        >
          {{ link.label }}
          <!-- <svg:tspan x="10" dy="1.2em">{{ node.label.split("\n")[0] }}</svg:tspan>
          <svg:tspan x="10" dy="1.2em">{{ node.label.split("\n")[1] }}</svg:tspan>
          <svg:tspan x="10" dy="1.2em">{{ node.label.split("\n")[2] }}</svg:tspan> -->
        </textPath>
      </svg:text>
    </svg:g>
  </ng-template>
</ngx-graph>

<div
  *ngIf="infoContainer"
  class="info-container"
  [style.left.px]="infoContainer.position.x"
  [style.top.px]="infoContainer.position.y"
  [innerHtml]="infoContainer.label"
></div>
